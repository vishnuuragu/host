<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Discovery App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../index.html" class="back-link">Back to Home</a>
    <div class="container">
        <h1>Music Discovery App</h1>
        
        <div class="discovery-section">
            <h2>Discover New Music</h2>
            
            <div class="preferences">
                <div class="preference-group">
                    <label>Genre:</label>
                    <select id="genre-select">
                        <option value="">Any Genre</option>
                        <option value="rock">Rock</option>
                        <option value="pop">Pop</option>
                        <option value="jazz">Jazz</option>
                        <option value="classical">Classical</option>
                        <option value="electronic">Electronic</option>
                        <option value="hip-hop">Hip Hop</option>
                        <option value="country">Country</option>
                        <option value="folk">Folk</option>
                    </select>
                </div>
                
                <div class="preference-group">
                    <label>Mood:</label>
                    <select id="mood-select">
                        <option value="">Any Mood</option>
                        <option value="energetic">Energetic</option>
                        <option value="relaxing">Relaxing</option>
                        <option value="romantic">Romantic</option>
                        <option value="melancholic">Melancholic</option>
                        <option value="uplifting">Uplifting</option>
                    </select>
                </div>
                
                <div class="preference-group">
                    <label>Era:</label>
                    <select id="era-select">
                        <option value="">Any Era</option>
                        <option value="2020s">2020s</option>
                        <option value="2010s">2010s</option>
                        <option value="2000s">2000s</option>
                        <option value="90s">90s</option>
                        <option value="80s">80s</option>
                        <option value="70s">70s</option>
                        <option value="60s">60s</option>
                    </select>
                </div>
                
                <button id="discover-btn" class="action-btn">Discover Music</button>
            </div>
        </div>

        <div class="recommendations-section">
            <h3>Music Recommendations</h3>
            <div id="recommendations-list">
                <p class="no-recommendations">Set your preferences and click "Discover Music" to find new songs!</p>
            </div>
        </div>

        <div class="playlist-section">
            <h3>My Playlists</h3>
            <div class="playlist-controls">
                <input type="text" id="playlist-name" placeholder="New playlist name" />
                <button id="create-playlist-btn" class="action-btn">Create Playlist</button>
            </div>
            <div id="playlists-list">
                <p class="no-playlists">No playlists created yet.</p>
            </div>
        </div>

        <div class="favorites-section">
            <h3>Favorite Songs</h3>
            <div id="favorites-list">
                <p class="no-favorites">No favorite songs yet. Like some recommendations to see them here!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
