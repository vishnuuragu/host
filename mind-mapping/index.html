<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Mapping Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../index.html" class="back-link">Back to Home</a>
    <div class="container">
        <h1>Mind Mapping Tool</h1>
        
        <div class="toolbar">
            <div class="map-controls">
                <input type="text" id="map-title" placeholder="Mind Map Title" />
                <button id="add-node-btn" class="tool-btn">Add Node</button>
                <button id="clear-map-btn" class="tool-btn secondary">Clear Map</button>
                <button id="save-map-btn" class="tool-btn">Save Map</button>
            </div>
            
            <div class="node-controls" style="display: none;">
                <input type="text" id="node-text" placeholder="Node text" />
                <input type="color" id="node-color" value="#4A90E2" />
                <button id="update-node-btn" class="tool-btn">Update Node</button>
                <button id="delete-node-btn" class="tool-btn danger">Delete Node</button>
                <button id="cancel-edit-btn" class="tool-btn secondary">Cancel</button>
            </div>
        </div>

        <div class="mind-map-container">
            <div id="mind-map-canvas">
                <div class="instructions">
                    <p>Click "Add Node" to create your first node</p>
                    <p>Click on nodes to edit them</p>
                    <p>Drag nodes to reposition them</p>
                </div>
            </div>
        </div>

        <div class="saved-maps">
            <h3>Saved Mind Maps</h3>
            <div id="saved-maps-list">
                <p class="no-maps">No saved mind maps yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
