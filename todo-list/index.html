<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organize tasks with priorities and filters — a self-contained vanilla JS module of interactive.os.">
    <meta name="theme-color" content="#030409">
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>To-Do List — interactive.os</title>
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body data-accent="violet">

    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-nav-wrap">
        <nav class="app-nav" aria-label="Module">
            <a href="../index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg>
                <span>All modules</span>
            </a>
            <span class="app-nav-title">
                <span class="glyph" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 9.5h8M8 14.5h5"/></svg>
                </span>
                To-Do List
            </span>
            <span class="app-nav-meta" aria-hidden="true"><span class="pulse-dot"></span><span class="meta-extra">MODULE 02 / 10</span></span>
        </nav>
    </header>

    <main class="app-main container" id="main">
        <header class="app-head">
            <p class="eyebrow"><span class="eyebrow-index">02</span> MODULE</p>
            <h1>To-Do <span class="holo">List</span></h1>
            <p class="app-sub">Capture tasks, assign a priority, and clear them down. Filters keep the queue focused.</p>
        </header>

        <div class="todo-shell">
            <section class="panel" data-reveal>
                <div class="task-form">
                    <input type="text" id="task-input" placeholder="Enter a new task…" aria-label="New task" />
                    <select id="priority-select" aria-label="Priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button id="add-task-btn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Add task
                    </button>
                </div>
            </section>

            <section class="panel" data-reveal>
                <div class="filters">
                    <div class="seg" role="group" aria-label="Filter tasks">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="pending">Pending</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <button id="clear-completed-btn" class="btn btn-danger btn-sm clear-completed-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7m3.2 0-.7 12a1.6 1.6 0 0 1-1.6 1.5H8.6A1.6 1.6 0 0 1 7 19L6.3 7"/></svg>
                        Clear completed
                    </button>
                </div>
                <ul id="task-list"></ul>
            </section>
        </div>
    </main>

    <footer class="app-foot">INTERACTIVE.OS · LOCAL-FIRST · <a href="../index.html">RETURN TO HUB</a></footer>

    <script src="../shared/theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
